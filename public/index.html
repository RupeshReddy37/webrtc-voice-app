<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Call WebRTC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Navigation Toggle -->
        <div class="nav-toggle">
            <button class="toggle-btn active" id="voiceToggle">🎧 Voice Call</button>
            <button class="toggle-btn" id="videoToggle">📹 Video Call</button>
            <button class="toggle-btn" id="chatToggle">💬 Text Chat</button>
        </div>


        <!-- Voice Call Content -->
        <h1>Voice Call WebRTC</h1>

        <!-- Room Join Controls -->
        <div class="controls">
            <input type="text" id="roomIdInput" placeholder="Enter Room ID" autocomplete="off">
            <button id="joinBtn">Join</button>
        </div>

        <!-- Status Text -->
        <div class="status-text" id="statusText">🔴 Disconnected</div>

        <!-- Dial Call Button -->
        <button id="dialBtn" class="dial-btn" disabled>📞 Dial Call</button>
    </div>

    <!-- Socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Voice WebRTC logic -->
    <script src="js/audio-app.js"></script>
</body>
</html>
