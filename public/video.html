<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-on-1 Video Call</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Navigation Toggle -->
        <div class="nav-toggle">
            <button class="toggle-btn" id="voiceToggle">🎧 Voice Call</button>
            <button class="toggle-btn active" id="videoToggle">📹 Video Call</button>
        </div>

        <!-- Video Call Content -->
        <h1>1-on-1 Video Call</h1>

        <!-- Room Join Controls -->
        <div class="controls">
            <input type="text" id="roomIdInput" placeholder="Enter Room ID" autocomplete="off">
            <button id="joinBtn">Join Room</button>
        </div>

        <!-- Status Text -->
        <div class="status-text" id="statusText">🔴 Disconnected</div>

        <!-- Picture-in-Picture (PiP) Video Layout -->
        <div class="video-stage">
            <!-- Remote video: large main box -->
            <video id="remoteVideo" autoplay playsinline></video>
            <!-- Local video: small box floating bottom-right -->
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <!-- Dial Video Call Button -->
        <button id="dialBtn" class="dial-btn" disabled>📹 Dial Video Call</button>
    </div>

    <!-- Socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Video WebRTC logic -->
    <script src="js/video-app.js"></script>
</body>
</html>
